<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Sunyi</title>
    <link rel="stylesheet" href="../css/reset.css">
    <script src="../scripts/main.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@300;400&display=swap"
        rel="stylesheet">

    <style>
        /* ===== BOOK MODE ===== */
        body.book .list {
            display: none;
        }

        body.book .poem-box {
            max-width: 700px;
            background: rgba(255, 255, 255, 0.03);
            padding: 60px 60px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        body.light.book .poem-box {
            background: #fffdf8;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        body.book .title {
            text-align: center;
        }

        body.book .poem {
            font-size: 1.15rem;
            column-count: 2;
            column-gap: 60px;
        }

        body.darker {
            background: radial-gradient(circle at top, #070707, #000);
        }

        .container {
            margin: auto;
            padding: 100px;
        }

        .controls button {
            background: none;
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 6px 12px;
            margin-left: 8px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .controls button:hover {
            border-color: var(--text);
        }

        .poem {
            transition: letter-spacing .3s ease;
        }

        .poem-area {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 40px;
        }

        .list {
            border-right: none;
            padding-right: 0;
        }

        .list div {
            padding: 6px 0;
            transition: color .2s ease;
        }

        .list div.active {
            color: var(--text);
        }

        .poem-box {
            animation: fade 1s ease;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin-bottom: 30px;
        }

        .poem {
            font-family: 'Playfair Display', serif;
            line-height: 2.1;
            white-space: pre-line;
            font-size: 18px;
            max-width: 65ch;
        }

        /* ===== BOOK NAVIGATION ===== */
        .book-controls {
            display: none;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        body.book .book-controls {
            display: flex;
        }

        .book-controls button {
            background: none;
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 6px 16px;
            cursor: pointer;
            border-radius: 6px;
        }

        /* ===== PAGE FLIP EFFECT ===== */
        .poem-box {
            perspective: 1200px;
            padding: 40px 20px;
        }

        .poem.flip {
            animation: flip 0.6s ease;
        }

        .meta {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .exit-zen {
            position: fixed;
            bottom: 20px;
            right: 20px;
            opacity: .4;
            font-size: .7rem;
            cursor: pointer;
        }

        body.zen .exit-zen {
            display: block;
        }

        .exit-zen {
            display: none;
        }

        .logo:hover::after {
            content: "menulis adalah cara bertahan";
            display: block;
            font-size: .6rem;
            opacity: .5;
        }

        #progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: var(--text);
            width: 0%;
            z-index: 999;
        }

        body.zen header,
        body.zen .list,
        body.zen footer,
        body.zen .controls {
            display: none;
        }

        body.zen .container {
            padding-top: 80px;
        }

        .copy-btn {
            margin-top: 20px;
            border: 1px solid var(--accent);
            background: none;
            color: var(--text);
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 6px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .controls>div {
            display: flex;
            gap: 4px;
        }

        #modalExport {
            flex-direction: column;
            padding: 50px;
            background: var(--card);
            position: fixed;
            border: solid var(--accent) 1px;
            border-radius: 20px;
            gap: 20px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            transition: all 0.2s ease-in-out;
        }

        #modalExport.active {
            display: flex;
        }
        
        #modalExport .export {
            padding: 3px 10px;
            border-radius: 10px;
            border: var(--accent) solid 1px;
            background: none;
        }

        button.exit-export {
            border: none;
            background: none;
            color: red;
            font-size: 20px;
            font-weight: bold;
            position: absolute;
            top: 1px;
            right: 10px;
        }

        /* keyframes */
        @keyframes flip {
            0% {
                transform: rotateY(0deg);
                opacity: 1;
            }

            50% {
                transform: rotateY(-90deg);
                opacity: 0.2;
            }

            100% {
                transform: rotateY(0deg);
                opacity: 1;
            }
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .poem-area {
                display: grid;
                grid-template-columns: 280px minmax(0, 1fr);
                gap: 60px;
            }

            .list {
                border-right: none;
                border-bottom: 1px solid var(--accent);
                padding-bottom: 20px;
                margin-bottom: 30px;
            }

            body.book .poem {
                column-count: 1;
            }
        }

        @media (min-width: 1024px) {
            .poem-box {
                background: rgba(255, 255, 255, 0.02);
                padding: 60px 80px;
                border-radius: 16px;
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
            }

            .poem {
                font-size: 17px;
                line-height: 2.3;
            }

            .title {
                font-size: 2.6rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">Programmind</div>

        <nav id="nav">
            <a href="index.html">Home</a>
            <a href="index.html">Blog</a>
            <a href="https://whois65.github.io/portfolio/">About</a>
            <a href="https://whois65.github.io/portfolio/#contact">Contact</a>
            <button class="toggle" onclick="toggleDark()"><i class="ti ti-moon"></i> </button>
        </nav>

        <div class="hamburger" onclick="document.getElementById('nav').classList.toggle('active')">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </header>

    <main>
        <div class="hero">
            <h1>Ruang Sunyi</h1>
        </div>

        <div class="container">
            <div class="controls">
                <button onclick="toggleBook()">Book</button>
                <button onclick="toggleSound()">Sound</button>
                <button onclick="quoteMode()">Quote</button>
                <button onclick="toggleZen()">Zen</button>
                <button onclick="shufflePoem()">Shuffle</button>
                <div class="fontControl">
                    Font size:
                    <button onclick="fontS(false)">−</button>
                    <input type="text" id="fontSin" style="border: none;width: 30px;outline: none;">
                    <button onclick="fontS(true)">+</button>
                </div>
                <button onclick="modalEx()">Export</button>
            </div>
            <div class="exit-zen" onclick="toggleZen()">keluar</div>
            <div id="modalExport" hidden>
                <button class="exit-export" onclick="modalEx()">x</button>
                <button class="export" onclick="exportPDF()">PDF</button>
                <button class="export" onclick="exportHTML()">HTML</button>
                <button class="export" onclick="exportMD()">Markdown</button>
            </div>
            <div id="progress"></div>
            <section class="poem-area">
                <div class="list" id="list"></div>
                <div class="poem-box">
                    <div class="meta" id="meta"></div>
                    <div class="title" id="title"></div>
                    <div class="poem" id="poem"></div>
                </div>
                <div class="book-controls">
                    <button onclick="prevPoem()">← Prev</button>
                    <button onclick="nextPoem()">Next →</button>
                </div>
            </section>


        </div>
    </main>
    <footer>© 2026 Ruang Sunyi</footer>

    <audio id="sound" loop>
        <source
            src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7d6a2f3f54.mp3?filename=dark-ambient-110997.mp3">
    </audio>

    <script>
        const poems = [
            {
                author: "Ruang Sunyi",
                date: "2026-01-16",
                title: "Di Tengah Dunia yang Terlampau Padat",
                text: `Di antara hiruk yang saling melukai,
ia menyimpan hasrat
seperti bara yang lupa caranya menyala,
bertahan di bawah reruntuhan suara.

Dunia terlampau penuh—
oleh nama-nama yang dipaksakan,
oleh arah yang tak pernah ia pilih,
oleh mimpi asing
yang melekat di tubuhnya
seperti bayang-bayang.

Ia ingin melangkah,
namun ruang menyempit oleh kemungkinan.
Ia ingin bersuara,
namun makna luruh
sebelum sempat menjelma kata.

Apa yang tersisa tak berteriak,
hanya bergetar lirih,
menunggu dikenali
di sela napas yang terputus-putus.

Hasrat itu belum mati—
ia berdiam,
menyusut,
namun menolak lenyap.
Seperti cahaya tanpa sumber,
bertahan
di dunia yang menutup dirinya sendiri.`
            },
            {
                author: "Ruang Sunyi",
                date: "2026-01-16",
                title: "Tanpa Wujud",
                text: `Sesuatu yang tak berwujud,
diakui semesta,
namun hanya mampu hadir sebagai rasa—
tanpa daya,
di tengah kesepian.`
            }
        ], list = document.getElementById("list")
            , titleEl = document.getElementById("title")
            , poemEl = document.getElementById("poem")
            , box = document.querySelector(".poem-box")
            , audio = document.getElementById("sound");

        let current = 0;

        /* ===== LOAD POEM ===== */
        function loadPoem(i) {
            const metaEl = document.getElementById("meta");
            const date = poems[i].date || "—";
            const author = poems[i].author || "Anonim";
            const words = poems[i].text.split(/\s+/).length;
            const minutes = Math.max(1, Math.round(words / 120));
            current = i;
            metaEl.textContent = `${author} — ${date} · ~${minutes} min`;
            box.classList.remove("flip");
            void box.offsetWidth;
            box.classList.add("flip");

            titleEl.textContent = poems[i].title;
            poemEl.textContent = poems[i].text;

            const last = localStorage.getItem("lastLine");
            if (last) console.log("Terakhir tersentuh:", last);

            [...list.children].forEach(c => c.classList.remove("active"));
            list.children[i]?.classList.add("active");

            localStorage.setItem("poemIndex", i);
        }

        /* ===== NAVIGATION ===== */
        let nextPoem = () => loadPoem((current + 1) % poems.length),
            prevPoem = () => loadPoem((current - 1 + poems.length) % poems.length);

        /* ===== TOGGLES (SAVED) ===== */
        const toggleBook = () => {
            document.body.classList.toggle("book");
            saveState();
        }, toggleSound = () => {
            if (audio.paused) {
                audio.volume = 0;
                audio.play();
                let v = 0;
                const fade = setInterval(() => {
                    v += 0.02;
                    audio.volume = Math.min(v, 0.6);
                    if (v >= 0.6) clearInterval(fade);
                }, 50);
            } else {
                let v = audio.volume;
                const fade = setInterval(() => {
                    v -= 0.02;
                    audio.volume = Math.max(v, 0);
                    if (v <= 0) {
                        audio.pause();
                        clearInterval(fade);
                    }
                }, 50);
            }
        }, modalEx = () => document.getElementById("modalExport").classList.toggle("active")

        /* ===== SAVE STATE ===== */
        function saveState() {
            localStorage.setItem("state", JSON.stringify({
                light: document.body.classList.contains("light"),
                darker: document.body.classList.contains("darker"),
                book: document.body.classList.contains("book"),
                focus: document.body.classList.contains("focus")
            }));
        }
        /* ===== QUOTES ===== */
        function quoteMode() {
            const lines = poems[current].text.split("\n").filter(l => l.trim());
            poemEl.textContent = lines[Math.floor(Math.random() * lines.length)];
            titleEl.textContent = "— Kutipan Sunyi —";
        }

        /* ===== RESTORE ===== */
        (function restore() {
            const state = JSON.parse(localStorage.getItem("state") || "{}");
            Object.entries(state).forEach(([k, v]) => {
                if (v) document.body.classList.add(k);
            });

            const idx = +localStorage.getItem("poemIndex") || 0;
            loadPoem(idx);
        })();

        /* ===== KEYBOARD ===== */
        document.addEventListener("keydown", e => {
            if (e.key === "ArrowRight") nextPoem();
            if (e.key === "ArrowLeft") prevPoem();
            if (e.key === "b") toggleBook();
            if (e.key === "l") toggleTheme();
            if (e.key === "f") toggleFocus();
        });
        /* ===== FONT CONTROL ===== */
        let fontSize = +localStorage.getItem("fontSize") || 12;
        poemEl.style.fontSize = fontSize + "px";

        let fontsin = document.getElementById("fontSin");
        fontsin.value = poemEl.style.fontSize.replace("px", "");
        fontsin.addEventListener("change", () => {
            poemEl.style.fontSize = fontsin.value + "px";
            localStorage.setItem("fontSize", fontSize);
        });

        let fontS = mode => {
            if (mode) fontSize += 1;
            else fontSize -= 1;
            poemEl.style.fontSize = fontSize + "px";
            fontsin.value = fontSize;
            localStorage.setItem("fontSize", fontSize);
        }

        /* ===== ZEN MODE ===== */
        function toggleZen() {
            document.body.classList.toggle("zen");
        }

        /* ===== SHUFFLE ===== */
        function shufflePoem() {
            const i = Math.floor(Math.random() * poems.length);
            loadPoem(i);
        }

        /* ===== PROGRESS ===== */
        window.addEventListener("scroll", () => {
            const h = document.documentElement;
            const progress = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100;
            document.getElementById("progress").style.width = progress + "%";
        });

        /* ===== COPY ===== */
        const copyBtn = document.createElement("button");
        copyBtn.textContent = "Copy";
        copyBtn.className = "copy-btn";
        copyBtn.onclick = () => navigator.clipboard.writeText(poemEl.textContent);
        box.appendChild(copyBtn);

        poemEl.addEventListener("mouseup", () => {
            const sel = window.getSelection().toString();
            if (sel) localStorage.setItem("lastLine", sel);
        });

        /* ===== LIST ===== */
        poems.forEach((p, i) => {
            const item = document.createElement("div");
            item.textContent = p.title;
            item.onclick = () => loadPoem(i);
            list.appendChild(item);
        });
        document.addEventListener("keydown", e => {
            if (e.key === "Escape") {
                document.body.classList.remove("zen", "focus", "book");
            }
        });
    </script>

    <script id="Export">
        /* ===== EXPORT UTIL ===== */
        function fileName() {
            return poems[current].title
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/(^-|-$)/g, "");
        }

        /* ===== EXPORT HTML ===== */
        function exportHTML() {
            const html = `
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>${poems[current].title}</title>
<style>
body {
    font-family: 'Playfair Display', serif;
    background: #0b0b0b;
    color: #e6e6e6;
    padding: 60px;
    line-height: 2;
}
h1 { text-align: center; }
pre { white-space: pre-wrap; font-size: 1.1rem; }
</style>
</head>
<body>
    <h1>${poems[current].title}</h1>
    <p style="text-align:center;opacity:.6;font-size:.8rem">
    ${poems[current].author} — ${poems[current].date}
    </p>
<pre>${poems[current].text}</pre>
<\/body>
<\/html>`;

            download(html, fileName() + ".html", "text/html");
        }

        /* ===== EXPORT MARKDOWN ===== */
        function exportMD() {
            const md = `# ${poems[current].title}

*${poems[current].author} — ${poems[current].date}*

${poems[current].text}`;
            download(md, fileName() + ".md", "text/markdown");
        }

        /* ===== EXPORT PDF ===== */
        function exportPDF() {
            const win = window.open("", "_blank");
            win.document.write(`
<html>
<head>
<title>${poems[current].title}</title>
<style>
body {
    font-family: 'Playfair Display', serif;
    padding: 60px;
    line-height: 2;
}
h1 { text-align: center; }
pre { white-space: pre-wrap; font-size: 14pt; }
@media print {
    body { margin: 0; }
}
</style>
</head>
<body>
<h1>${poems[current].title}</h1>
<p style="text-align:center;opacity:.6;font-size:.8rem">
${poems[current].author} — ${poems[current].date}
</p>
<pre>${poems[current].text}</pre>
<script>
window.onload = () => {
    window.print();
    window.onafterprint = () => window.close();
};
<\/script>
<\/body>
<\/html>
`);
            win.document.close();
        }

        /* ===== DOWNLOAD HELPER ===== */
        function download(content, filename, type) {
            const blob = new Blob([content], { type });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            URL.revokeObjectURL(a.href);
        }
        localStorage.setItem("defaultAuthor", "Ruang Sunyi");
        window.addEventListener("scroll", () => {
            const y = window.scrollY;
            poemEl.style.letterSpacing = Math.min(y / 2000, 0.05) + "em";
        });
    </script>
</body>

</html>
