<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap - Programmind</title>
    <link rel="stylesheet" href="../css/reset.css">
    <script src="../scripts/main.js"></script>
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* ===== GRID ===== */
        .container {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        /* ===== CARD ===== */
        .card {
            border-radius: 16px;
            padding: 20px;
            transition: 0.3s;
            border: 1px solid var(--accent-hover);
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            margin-bottom: 8px;
            font-size: 18px;
        }

        .card p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
        }

        /* ==== TAG ==== */
        .tag {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">Programmind</div>
        <nav class="nav-menu" id="nav">
            <a href="../index.html">Home</a>
            <a href="../index.html">Blog</a>
            <a href="https://whois65.github.io/portfolio/">About</a>
            <a href="https://whois65.github.io/portfolio/#contact">Contact</a>
            <button class="toggle" onclick="toggleDark()">🌙</button>
        </nav>
        <div class="hamburger" onclick="document.getElementById('nav').classList.toggle('active')">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>
    <main>
        <section class="hero">
            <h2>Learning Roadmap</h2>
            <p>
                A structured path to master subjects step by step.
                Stay consistent, keep improving, and build your future.
            </p>
        </section>
        <section class="container"></section>
    </main>
    <footer>
        <p>© 2026 Programmind. Built for growth.</p>
    </footer>
    <script>
        const roadmaps = [
            {
                subject: "Biology",
                tag: "Science",
                id: "biology",
                description: "Explore living systems, from cells to ecosystems, and understand how life works."
            },
            {
                subject: "Business",
                tag: "Economics",
                id: "business",
                description: "Learn how to create value, build ventures, and turn ideas into income."
            },
            {
                subject: "Chemistry",
                tag: "Science",
                id: "chemistry",
                description: "Study matter, its structure, and the reactions that shape the world."
            },
            {
                subject: "Economics",
                tag: "Economics",
                id: "economics",
                description: "Understand how money, markets, and global economies work."
            },
            {
                subject: "English",
                tag: "Language",
                id: "english",
                description: "Improve communication, writing, and global understanding."
            },
            {
                subject: "Indonesian",
                tag: "Language",
                id: "indonesian",
                description: "Master formal writing and effective communication in your native language."
            },
            {
                subject: "Japanese",
                tag: "Language",
                id: "japanese",
                description: "Master grammar, kanji, and real-world communication skills."
            },
            {
                subject: "Mandarin",
                tag: "Language",
                id: "mandarin",
                description: "Learn tones, characters, and practical daily communication."
            },
            {
                subject: "Mathematics",
                id: "math",
                description: "Build strong logical thinking and problem-solving skills."
            },
            {
                subject: "Philosophy",
                id: "philosophy",
                description: "Develop critical thinking, logic, and a deeper understanding of life and reality."
            },
            {
                subject: "Physics",
                tag: "Science",
                id: "physics",
                description: "Understand the fundamental laws that govern the universe."
            },
            {
                subject: "Programming",
                id: "programming",
                description: "Build software, solve real-world problems, and create powerful projects."
            },
            {
                subject: "Cybersecurity",
                id: "cybersecurity",
                description: "Protect systems, understand threats, and secure digital environments."
            },
            {
                subject: "UI/UX Design",
                id: "uiux",
                description: "Design intuitive, modern, and user-friendly digital experiences."
            }
        ];
        roadmaps.forEach(roadmap => {
            let a = document.createElement("a");
            if (roadmap.tag !== undefined)  a.innerHTML = `<div class="card"><div class="tag">${roadmap.tag}</div><h3>${roadmap.subject}</h3><p>${roadmap.description}</p></div>`;
            else  a.innerHTML = `<div class="card"><h3>${roadmap.subject}</h3><p>${roadmap.description}</p></div>`;
            a.href = "roadmap/index.html?subject=" + roadmap.id;
            a.style = "text-decoration: none;color: inherit;"
            document.querySelector(".container").appendChild(a)
        });
    </script>
</body>

</html>
