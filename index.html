<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmind</title>
    <link rel="stylesheet" href="css/reset.css">
    <script src="scripts/main.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
    <style>
        /* ==== BUTTON ==== */
        .btn {
            margin-top: 15px;
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            color: var(--accent);
            background: #fff;
            cursor: pointer;
        }

        /* ==== ARTICLES ==== */
        section {
            padding: 20px;
        }

        .articles {
            display: grid;
            gap: 20px;
            max-width: 900px;
            margin: auto;
        }

        .article {
            display: flex;
            gap: 15px;
            background: var(--card);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .05);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn .5s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .article:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, .08);
        }

        .article img {
            width: 180px;
            border-radius: 10px;
            object-fit: cover;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .container p {
            color: var(--sub);
            font-size: 14px;
            line-height: 1.6;
        }

        /* ==== TAG ==== */
        .tags {
            gap: 10px;
            display: flex;
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            background: var(--accent);
            color: #fff;
            font-size: 12px;
        }

        /* ==== BUTTON ==== */
        .container button {
            margin-top: auto;
            align-self: flex-start;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--accent);
            background: none;
            cursor: pointer;
            color: var(--accent);
        }

        .container button:hover {
            background: var(--accent);
            color: #fff;
        }

        /* ==== MOBILE ==== */
        @media(max-width:768px) {
            nav {
                display: none;
                position: absolute;
                top: 60px;
                right: 20px;
                flex-direction: column;
                background: var(--card);
                padding: 15px;
                border-radius: 10px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, .1);
            }

            nav.active {
                display: flex;
            }

            .hamburger {
                display: flex;
            }

            .article {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo" onclick="location.href = 'index.html'">Programmind</div>

        <nav class="nav-menu" id="nav">
            <a href="index.html">Home</a>
            <a href="index.html">Blog</a>
            <a href="https://whois65.github.io/portfolio/">About</a>
            <a href="https://whois65.github.io/portfolio/#contact">Contact</a>
            <button class="toggle" onclick="toggleDark()"><i id="toggleDarkIcon" class="ti ti-moon"></i></button>
        </nav>

        <div class="hamburger" onclick="document.getElementById('nav').classList.toggle('active')">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </header>
    <main>
        <!-- HERO -->
        <section class="hero">
            <h1>Learning today to build the future</h1>
            <p>Exploring technology, languages, and the future—one step at a time.</p>
            <button class="btn" onclick="document.getElementById('articles').scrollIntoView({behavior:'smooth'})">
                Start Reading
            </button>
        </section>

        <!-- ARTICLES -->
        <section id="articles" class="articles">
            

        </section>
    </main>

    <footer>
        <p>© 2026 <strong>Programmind</strong>. All rights reserved.</p>
    </footer>
    <script>
        fetch("articles/articles.json").then(res => res.json()).then(contents => {
            qi("articles").innerHTML += "<h2>Latest Posts</h2>";
            contents.forEach(content => {
                const article = document.createElement("div");
                let tags = ""
                content.tag.forEach(tag => {
                    tags += `<div class="tag">${tag}</div>`
                })
                tags += content.date;
                article.innerHTML = `<div class="article" style="cursor:pointer;"><img src="${content.image[0] === "h" ? content.image : "images/" + content.image}"><div class="container"><h3>${content.title}</h3><p>${content.description}</p><span class="tags">${tags}</span><button onclick="window.location.href = '${content.id[0] !== "h" ? "articles/index.html?id=" + content.id : content.id}'">Read More</button></div></div>`;
                document.getElementById("articles").appendChild(article);
            })
        }).catch(err=> qi("articles").innerHTML += "<center><h2>Error: " + err +"</h2></center>")
    </script>

</body>

</html>
